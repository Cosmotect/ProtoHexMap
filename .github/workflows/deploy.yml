name: Deploy to GitHub Pages

on:
  push:
    branches: [dev, dev-prototype]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Builds the "dev" branch. This becomes the site root:
  # https://cosmotect.github.io/ProtoHexMap/
  build-root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload root build (temporary, workflow-internal)
        uses: actions/upload-artifact@v4
        with:
          name: build-root
          path: ./dist
          retention-days: 1

  # Builds the "dev-prototype" branch. This becomes the /Unstable/ subfolder:
  # https://cosmotect.github.io/ProtoHexMap/Unstable/
  build-unstable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-prototype
        uses: actions/checkout@v6
        with:
          ref: dev-prototype

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Unstable build (temporary, workflow-internal)
        uses: actions/upload-artifact@v4
        with:
          name: build-unstable
          path: ./dist
          retention-days: 1

  # Combines both builds into one folder structure and publishes it as the
  # single live GitHub Pages site.
  combine-and-deploy:
    needs: [build-root, build-unstable]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download root build into combined/
        uses: actions/download-artifact@v4
        with:
          name: build-root
          path: combined

      - name: Download Unstable build into combined/Unstable/
        uses: actions/download-artifact@v4
        with:
          name: build-unstable
          path: combined/Unstable

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site as the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: combined

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
