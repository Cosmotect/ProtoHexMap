<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Hex World Map</title>
    <!-- Inline favicon: stops the browser's automatic /favicon.ico request (a 404). -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⬡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap" />
  </head>
  <body>
    <div id="scene"></div>

    <div id="hud">
      <div class="top-right menu-wrap" id="menu-wrap">
        <button id="btn-menu" class="menu-toggle" data-i18n="menu.button" data-i18n-title="menu.button.title">Menu</button>
        <div id="menu" class="panel menu hidden">
          <div class="title"><span data-i18n="menu.title">HEX WORLD MAP</span> <span class="version" data-i18n="menu.version">prototype</span></div>
          <div class="menu-section">
            <div class="menu-title" data-i18n="menu.section.map">Map</div>
            <div class="seed-bar">
              <span><span data-i18n="menu.seed">Seed</span> <b id="seed-value">-</b></span>
              <span id="path-info" class="muted"></span>
            </div>
            <div class="seed-bar">
              <input id="seed-input" type="text" data-i18n-placeholder="menu.seed.placeholder" data-i18n-title="menu.seed.input.title" placeholder="type a seed" />
              <button id="btn-load-seed" data-i18n="menu.load" data-i18n-title="menu.load.title">Load</button>
              <button id="btn-copy" data-i18n="menu.copy" data-i18n-title="menu.copy.title">Copy link</button>
            </div>
            <div class="menu-row">
              <button id="btn-new" data-i18n="menu.new" data-i18n-title="menu.new.title">New map</button>
              <button id="btn-restart" data-i18n="menu.restart" data-i18n-title="menu.restart.title">Restart</button>
              <button id="btn-reveal" data-i18n="menu.reveal" data-i18n-title="menu.reveal.title">Reveal map</button>
            </div>
            <div class="menu-row">
              <button id="btn-win-battle" data-i18n="menu.winBattle" data-i18n-title="menu.winBattle.title">Win battle</button>
            </div>
          </div>
          <div class="menu-section">
            <div class="menu-title" data-i18n="menu.section.tuning">Tuning</div>
            <div class="menu-row">
              <button id="btn-settings" data-i18n="menu.settings" data-i18n-title="menu.settings.title">Settings</button>
            </div>
          </div>
          <div class="menu-section">
            <div class="menu-title" data-i18n="menu.section.learn">Learn</div>
            <div class="menu-row">
              <button id="btn-tutorial" class="npe" data-i18n="menu.tutorial" data-i18n-title="menu.tutorial.title">Tutorial</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Top-centre bar: the turn on the left, the fatigue scale in the middle
           (one box per step, each showing the fatigue % that step brings; the
           boxes fill as the party walks and empty on a reset), supplies on the
           right. Hairline separators keep the three readings apart. -->
      <div class="panel top-center fatigue-bar" id="fatigue-bar">
        <div class="bar-slot" id="slot-turn">
          <div class="stat"><span class="label" data-i18n="status.turn">Turn</span><span id="stat-turn" class="value">-</span></div>
        </div>
        <div class="bar-sep"></div>
        <div id="fatigue-boxes" class="fatigue-boxes" data-i18n-title="fatiguebar.title"></div>
        <div class="bar-sep"></div>
        <div class="bar-slot" id="slot-supplies">
          <div class="stat"><span class="label" data-i18n="status.supplies">Supplies</span><span id="stat-supplies" class="value">-</span></div>
        </div>
      </div>

      <div class="panel left-mid party" id="party">
        <div class="party-title" data-i18n="party.title">Party</div>
        <div id="party-units"></div>
      </div>

      <!-- Encounter window (top centre): shop, events, battle reports, "choose a unit".
           It has no close button: the player always picks one of its options. -->
      <div id="dialog" class="panel dialog hidden">
        <div class="dialog-head"><span id="dialog-title" class="dialog-title"></span></div>
        <div id="dialog-body" class="dialog-body"></div>
        <div id="dialog-actions" class="dialog-actions"></div>
      </div>

      <!-- "Are you sure?" box for choices that skip a reward -->
      <div id="confirm" class="modal hidden">
        <div class="modal-box">
          <h2 id="confirm-title">Are you sure?</h2>
          <p id="confirm-text"></p>
          <div class="row"><button id="btn-confirm-no" data-i18n="confirm.no">Go back</button><button id="btn-confirm-yes" data-i18n="confirm.yes">Yes, do it</button></div>
        </div>
      </div>

      <!-- Status bar: just the one action button. Supplies, fatigue and the turn
           all live in the top-centre bar. -->
      <div class="panel bottom-center statusbar" id="statusbar">
        <button id="btn-enter" class="enter" disabled>Enter</button>
      </div>

      <!-- Battle bar: shown instead of the status bar while a fight runs on the
           local map. Active unit, its abilities, End turn. src/ui.js fills it
           from the combat engine's state. -->
      <div class="panel bottom-center battlebar hidden" id="battle-bar">
        <div class="battle-info">
          <span id="battle-round" class="battle-round"></span>
          <span id="battle-active" class="battle-active"></span>
        </div>
        <div id="battle-abilities" class="battle-abilities"></div>
        <button id="btn-end-turn" class="enter" data-i18n="battle.ui.endTurn" data-i18n-title="battle.ui.endTurn.title">End turn</button>
      </div>

      <div id="fatigue-tip" class="fatigue-tip hidden"></div>
      <div id="banner" class="banner hidden"></div>

      <!-- The event log. Hidden by default; Settings > General turns it back on. -->
      <div class="panel bottom-left hidden" id="log-panel">
        <div id="log" class="log"></div>
      </div>

      <div class="panel bottom-right">
        <div id="hover-info" class="hover-info hidden"></div>
        <div id="legend" class="legend">
          <div class="legend-label"><span data-i18n="legend.label">Legend</span> <span class="muted" data-i18n="legend.hover">(hover)</span></div>
          <div id="legend-items" class="legend-items"></div>
        </div>
      </div>

      <!-- Transparent sheet that swallows clicks while the guide waits for "Got it" (the menu stays above it) -->
      <div id="input-block" class="input-block hidden"></div>
      <!-- Green line from the guide card to the HUD piece it talks about -->
      <svg id="tutorial-lines" class="tutorial-lines" aria-hidden="true"></svg>

      <!-- Settings window: the config files, editable at runtime -->
      <div id="settings" class="modal settings hidden">
        <div class="modal-box settings-box">
          <div class="dialog-head"><h2 data-i18n="settings.title">Settings</h2><div class="row"><button id="btn-settings-copy" class="small" data-i18n="settings.copy" data-i18n-title="settings.copy.title">Copy changes</button><button id="btn-settings-reset-tab" class="small" data-i18n="settings.resetTab" data-i18n-title="settings.resetTab.title">Reset tab</button><button id="btn-settings-close" data-i18n="settings.close">Close</button></div></div>
          <div id="settings-tabs" class="tabs"></div>
          <div id="settings-body" class="settings-body"></div>
        </div>
      </div>

      <!-- New player experience card -->
      <div id="tutorial" class="panel tutorial hidden">
        <div class="tutorial-kicker" data-i18n="npe.kicker">New player experience</div>
        <div id="tutorial-title" class="tutorial-title"></div>
        <div id="tutorial-body" class="tutorial-body"></div>
        <div class="row"><button id="btn-tutorial-skip" class="small" data-i18n="npe.skip" data-i18n-title="npe.skip.title">Skip guide</button><span class="row-spacer"></span><button id="btn-tutorial-go" class="hidden">Go</button><button id="btn-tutorial-ok" data-i18n="npe.ok">Got it</button></div>
      </div>

      <!-- Start-screen roster: a fighting-game style grid of selectable companions -->
      <div id="roster" class="modal roster hidden">
        <div class="modal-box roster-box">
          <div class="roster-head">
            <h2 id="roster-title" data-i18n="roster.title">Choose a companion</h2>
            <span id="roster-sub" class="muted"></span>
          </div>
          <div id="roster-grid" class="roster-grid"></div>
          <div class="row"><button id="btn-roster-cancel" class="small" data-i18n="roster.cancel">Keep the party as it is</button></div>
        </div>
      </div>

      <div id="overlay" class="modal hidden">
        <div class="modal-box">
          <h2 id="overlay-title">Run over</h2>
          <p id="overlay-text"></p>
          <div class="row">
            <button id="btn-overlay-next" class="hidden">Next map</button>
            <button id="btn-overlay-inspect" data-i18n="end.inspect" data-i18n-title="end.inspect.title">Inspect the map</button>
            <button id="btn-overlay-restart" data-i18n="end.retry">Retry this map</button>
            <button id="btn-overlay-new" data-i18n="end.new">New map</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Startup splash: covers the screen while the game loads into the start
         screen, then fades away (src/main.js drives the timing). -->
    <div id="splash"><div class="splash-title">Everlands</div></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
